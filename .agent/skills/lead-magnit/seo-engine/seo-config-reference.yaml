# =====================================================================
#  Скилл статей - конфиг под автора (собран автопилотом из .business)
#  Стадия: STAGING. Скилл ещё НЕ промотан в live (~/.claude/skills),
#  пока не вшиты законы автора (humaniser/CTA-регистрация/no-ROI) и
#  не подключён publisher → Stateinik. См. отчёт в чате.
# =====================================================================

project:
  domain: "<твой-домен>"
  # Целевой раздел статей = движок Stateinik (Guides). Пока Stateinik не в прод -
  # текущий статик отдаёт /guide-<slug>/. # уточнить финальный префикс при деплое
  content_path: "/guides"

audience:
  profile: >
    Начинающий эксперт, который хочет зарабатывать на ИИ (вайбкодинг +
    вайбмаркетинг), но боится, что ему «нечего продать», что он «не эксперт»
    и что «уже поздно». Ищет не теорию, а пошаговую систему и готовые
    инструменты. # уточнить/обогатить из .business/audience/avatar.md
  # Читатель ищет действие, а не термины.
  jargon_level: "low"

voice:
  # Канон голоса автора. Тулзы калибруются по нему.
  source: "~/.business/voice-corpus/_voice-profile.md"
  forbidden:
    - "в современном мире"
    - "не секрет, что"
    - "погружаемся"
    - "в эпоху"

cta:
  # Справочное значение (STAGING) - боевой продукт РОВНО ОДИН и живёт в config.md
  # -> target_product/target_url, не хардкодить название здесь: продукт меняется,
  # этот файл нет.
  offer: "<config.md -> target_product>"
  # ЗАКОН автора: в контенте запуска/воронки единственное действие = РЕГИСТРАЦИЯ,
  # а не прямая продажа. Точный URL регистрации/ньюслеттера: # уточнить
  url: "<config.md -> target_url>"

editorial:
  # Реальные бренд-табу и юр-ограничения автора (из памяти/CLAUDE.md):
  banned_words:
    - "марафон"                     # событие = ВОРКШОП, не марафон
    - "перелив на 6 площадок"       # запрещённый концепт
    - "диверсификация от блокировок"
    - "доведём до результата"       # запрет обещаний результата
    - "окупит первым запуском"
    - "гарантия возврата"
    - "вернём деньги"
    - "вычет 13%"                   # говорить «налоговый вычет»

cms:
  # custom = публикация в движок Stateinik через admin-API.
  # Реализация: tools/stateinik_publish.py (общий слой ~/.claude/skills/_shared/tools).
  adapter: "custom"
  # Движок: пока локальный dev. После деплоя в прод поменять engine_env на боевой .env.
  engine_env: "<путь-к-твоему-cms-env>"
  # Автор статей в движке (создан адаптером, переиспользуется чтобы не плодить дубли).
  author_id: "<твой-author-id>"   # автор
  default_type: "tutorial"   # pillar | tutorial | playbook | recipe

tools:
  originality:
    # ── калибровка под НОВУЮ метрику соседей (по решению автора, волна r8) ──────────
    # Что поменялось ДО этой правки: фикс r8 сменил СОСТАВ корпуса сравнения.
    # Раньше черновик сверялся с тремя случайными файлами (самыми свежими по
    # времени модификации), теперь - с пятью БЛИЖАЙШИМИ ПО ТЕМЕ из всех
    # черновиков волны плюс страниц живого корпуса. Сравнение стало честным, и
    # распределение косинуса уехало вверх: порог 0.60 калибровался под случайного
    # соседа и под ближайшего по смыслу больше не годится.
    #
    # Замер по решению автора по 239 опубликованным страницам слепка corpus-2026-08-05
    # (это ПРИНЯТАЯ владельцем норма - страницы живут в выдаче):
    #   min 0.278 · p25 0.540 · МЕДИАНА 0.606 · p75 0.659 · p90 0.757 ·
    #   p95 0.814 · max 0.970
    # То есть старый порог 0.60 лёг РОВНО НА МЕДИАНУ принятого корпуса и красил
    # 125 страниц из 239 (52%) и 23 черновика из 53 (43%). Гейт, заваливающий
    # половину принятого корпуса, качество не защищает, а блокирует работу.
    #
    # 🔴 ГЛАВНОЕ, ЧТО ПОКАЗАЛ ЗАМЕР: косинус меряет БЛИЗОСТЬ ТЕМЫ, а не
    # заимствование. Дословное списывание ловит ВТОРАЯ нога гейта - max_ngram
    # (Jaccard по 5-словным цепочкам), и она откалибрована верно, её не трогали.
    # Улика: негативная фикстура селфтестов (дословная копия куска страницы)
    # даёт cosine 0.866 И ngram 0.691, и остаётся FAIL даже при max_cosine 0.99 -
    # её держит ngram-нога. Обратный случай: 4 реальных дубля корпуса
    # (guide-kassa-pod-pdf ←→ guide-otchet-kurs-claude-code и др.) дают ngram
    # 0.31-0.63, а вся остальная норма корпуса - медиана ngram 0.0026, p95 0.089.
    # Ноги разведены чисто, порог ngram менять не требуется.
    #
    # ══ ПОПРАВКА ТОГО ЖЕ ДНЯ: 0.80 ОТМЕНЁН, ВЕРНУЛИ 0.60 ═══════════════════
    # Замер выше снят ЧЕСТНО, но на СЛОМАННОЙ формуле косинуса, и вывод «косинус
    # меряет близость темы» из него не следует. Косинус мерил, НА КАКОМ ЯЗЫКЕ
    # написан текст: служебные слова из словаря не вычитались, а «idf» строился
    # по паре документов (df ∈ {1,2} → веса 1.0 и 1.405), то есть работал как
    # почти-константа. Разложение боевой пары с косинусом 0.6244: «не» 24.4%,
    # «на» 14.8%, «по» 6.1%, «из» 6.0%, «что» 5.2% - пять предлогов и частиц
    # дают 56% похожести при НУЛЕВОМ ngram. Корень починен в
    # tools/originality-check.py по решению автора (стоп-слова + idf по всему пулу
    # сравнения), после чего распределение вернулось на место.
    #
    # Тот же слепок corpus-2026-08-05, те же 239 страниц, обе формулы:
    #   было  min 0.278 · p25 0.542 · МЕД 0.608 · p75 0.669 · p90 0.761 · max 0.998
    #   стало min 0.106 · p25 0.261 · МЕД 0.353 · p75 0.465 · p90 0.607 · max 0.996
    #   при 0.60: было 129 из 239 красных (54%), стало 26 из 239 (10.9%)
    # И эти 26 - не шум, а 13 ВЗАИМНЫХ ПАР, каждая настоящий дубль темы:
    #   traffic ↔ traffic-uchenikam · voice-kit-sborka ↔ otchet-voice-kit ·
    #   otchet-kurs-claude-code ↔ kassa-pod-pdf · uzel-korpus ↔ korpus ·
    #   claude-code-ustanovka ↔ ustanovka-claude · markitdown ↔ markitdown-tokeny ·
    #   terminal ↔ svoboda · otklik ↔ rezume · otpiska ↔ otpiska-saas ·
    #   bezlimit ↔ claude-bez-limita · headroom ↔ zapas ·
    #   repozitorii ↔ 7-repo-uchit-ai · animate ↔ reference-boards
    # Ложных срабатываний в списке нет, разбирать эти пары и правда надо.
    #
    # 🔴 ПОЧЕМУ 0.80 НЕЛЬЗЯ ОСТАВИТЬ ДАЖЕ НА ПОЧИНЕННОЙ ФОРМУЛЕ. Тезис «дословное
    # держит ngram, значит косинус можно отпустить» верен только для ДОСЛОВНОГО
    # заимствования. Каннибализацию ПЕРЕСКАЗОМ ngram не видит вовсе: у 8 из 13
    # пар выше ngram = 0.002-0.099, то есть впятеро-в сто раз ниже своего порога
    # 0.30. Их держит ТОЛЬКО косинус. Негативная фикстура на живом материале
    # (перефразированный пересказ опубликованной статьи: та же структура, та же
    # фактура, свои слова) даёт cosine 0.683 при ngram 0.0044 - при 0.80 она
    # проходит гейт насквозь. Порог 0.80 оставляет гейт, ловящий только копипаст.
    max_cosine: 0.60         # число владельца, вернули после починки формулы.
                             # Лежит в зазоре: верх принятой нормы 0.465 (p75)
                             # / 0.607 (p90), самая мягкая негативная фикстура
                             # 0.683. ↑ поднимать - терять пересказы, ↓ опускать
                             # - возвращать ложные срабатывания.
                             # 🔗 СВЯЗАНО С ФОРМУЛОЙ: этот порог годен только
                             # вместе с tools/originality-check.py от этой редакции и
                             # позже. Откатишь инструмент на
                             # .bak-r7-orig-20260816 - верни сюда 0.80, иначе
                             # покраснеет половина корпуса.
    ngram_n: 5
    max_ngram: 0.30          # НЕ калибровался и не менялся: это и есть нога,
                             # ловящая дословное заимствование. Выше неё в
                             # принятом корпусе только настоящие дубли.
  cadence:
    # Дефолт 8.0; калибруем по живому голосу автора (см. baseline-прогон в чате).
    max_per_1k: 8.0   # уточнить по результату калибровки
  read_aloud:
    max_sentence_words: 40
  structure:
    min_internal_links: 3
    # Ось own-blocks (structure-check.py --own-blocks-hard): минимум блоков
    # собственного, невыводимого из модели материала на страницу. Гейт КАЖДОГО
    # касания - и новой статьи, и ревизии (01-parallel-i-emkost.md §6).
    # Засчитывается только машинно видимое: data-own="screenshot|measure|quote|
    # number|artifact", <blockquote cite="https://...">, число + внешняя ссылка
    # в одном предложении.
    min_own_blocks: 3
    # Ось chunk (structure-check.py, --chunk-hard): объём ОДНОГО контентного
    # H2-раздела. Правило чанк-слоя и обоснование - checklists/seo-geo.md §2.10.
    # Целевая вилка письма 150-400 слов, машинная терпимость шире, чтобы гейт
    # ловил провал (обрывок или простыня), а не естественный разброс.
    # Код-блоки и подписи под картинками в объём раздела не входят.
    chunk_min_words: 120
    chunk_max_words: 450
  own_evidence:
    # Гейт own-evidence (tools/own-evidence-check.py, стадия draft): каждый
    # блок ":::pre own=measure" / ":::figure ... own=measure" (structure-check
    # СЧИТАЕТ такие блоки штуками, own-evidence СВЕРЯЕТ их содержимое с
    # terminal-outputs/). Найден волной r8 по решению автора (5 статей из 7 несли
    # own=measure без подтверждающего лога/с разошедшимся числом/с чужой
    # командой) - калибровка по решению автора по всем 30 статьям lead-magnit-work/ с
    # own=measure (159 блоков): 88,1% подтверждено, 1,3% (2 блока/2 статьи)
    # не подтверждено - оба проверены руками, настоящие дефекты
    # (intora-design.ru не в логе; лимит Telegram 4096 не измерен ничем),
    # 10,7% - подписи без единой цифры (мягкий флаг, вердикт не роняют).
    # Пороги подобраны ИМЕННО под эту калибровку, менять с оглядкой на неё
    # (полный разбор - докстринг own-evidence-check.py, "ЧТО НЕ ДЕФЕКТ").
    min_anchor_chars: 10       # короче - слишком много случайных совпадений подстрок
    min_qualifying_digits: 2   # однозначные числа (порты, "4 токена") слишком общие
    number_tolerance_pct: 4.0  # округление в прозе ("7,6 ГБ" вместо 7.56) - НЕ фабрикация
    mtime_drift_minutes: 20    # только диагностика, вердикт не роняет (см. докстринг)
  title_ctr:
    # Гейт формулы сниппета (article_gates.py, стадии draft и page, гейт
    # `title-ctr`). Ось КЛИКОВ, а не ранжирования: замер корпуса на 44 страницах
    # с контролем по позиции внутри бакета 4-10 дал CTR 2.46% у title со
    # счётчиком-числом против 1.09% без него ПРИ ОДИНАКОВОЙ средней позиции
    # (7.14 против 7.36). Разбор и источники - _rebuild/r7/serp-bench.md, Т2-Т4,
    # Т6 и раздел 4.2. Ревизия старой страницы (--revision) те же замечания
    # печатает мягко: старый корпус не краснеет весь разом.
    # 🔴 Верх вилки поднят с 60 до 66 по решению автора. Конфликт был такой: гейт требовал
    # 51-60, а волна CTR-ретайтла осознанно шила 56-66 под ФОРМУЛУ ПОИСКОВОГО
    # ЗАПРОСА, и страница краснела ровно тогда, когда в источник возвращали живой
    # заголовок, уже стоящий в выдаче. Подгонять пришлось проверку, а не рабочие
    # заголовки. Цифра выведена, не назначена:
    #   • Google режет ссылку заголовка по пикселям (~600px десктоп). Замер нашего
    #     кириллического корпуса в шрифте выдачи (Arial 20px, 163 страницы): знак
    #     весит 9.94px, 600px = 60.3 знака - отсюда старая граница 60, и она верна
    #     ДЛЯ GOOGLE.
    #   • Яндекс показывает около 68 знаков без пробелов (до 74 с пробелами), до 66
    #     хвост виден целиком. Клики корпуса приходят из Яндекса.
    # • Свой замер с контролем по позиции (в даты запуска.2026, 300 URL, показов от 50):
    #     бакет 4-7 полоса 51-60 = CTR 2.77% при позиции 5.97, полоса 61-66 = 5.33%
    #     при 6.41; бакет 7.5-10 - 1.41% при 8.49 против 2.01% при 8.19. Длинная
    #     полоса не проваливается, она впереди.
    #   • Выше 66 не идём: там Яндекс начинает есть хвост, а своя выборка тонкая.
    # Ось не ослаблена: 61-66 печатает мягкую справку про обрезку в Google.
    min_len: 51              # короче - недоиспользован показ в выдаче
    max_len: 66              # длиннее - хвост не виден даже в Яндексе (около 68 знаков)
    desc_min_len: 130
    desc_max_len: 165
    # сколько знаков подряд в начале description должно совпасть с началом
    # title, чтобы считать это дублем: мобильная выдача режет описание примерно
    # на 90 знаках, и повтор заголовка там - выброшенная строка
    desc_dup_prefix_chars: 30
    capsule_min_words: 40    # капсула ответа = первый абзац после H1
    capsule_max_words: 60
    min_tables: 3            # таблицы = «очень высокая» надёжность извлечения в ИИ-ответы
    # формулы, выжигающие CTR (замер r7, раздел 4.2, строка 5). Регистр не важен
    banned_formulas:
      - "что это и как пользоваться"
      - "все пути"
      - "полное руководство"
      - "полный гайд"
    # Брендовый хвост в title (« - Имя Автора»): съедает знаки из 60 и не ищется.
    # По умолчанию пусто и БЕЗ чьего-либо имени: имя автора гейт берёт из личного
    # ~/.config/seo-publish.json (ключ author_name) и подставляет сам. Сюда
    # дописывают только дополнительные варианты написания своего бренда.
    banned_tails: []
    # Слова, после которых число читается как НОМЕР ВЕРСИИ продукта, а не как
    # счётчик: «Claude 5», «GPT 5.6» обещанием «пять штук» не являются. Если
    # статья про модель с цифрой в названии, гейт требует ДРУГОЕ число.
    # 🔴 список блочный (по «- item» в строке), а не инлайновый в квадратных
    # скобках: без PyYAML конфиг читает мини-парсер _config.py, и инлайновый
    # список, перенесённый на вторую строку, он разбирает в мусор
    version_brands:
      - claude
      - gpt
      - chatgpt
      - gemini
      - grok
      - llama
      - qwen
      - kimi
      - glm
      - mistral
      - deepseek
      - sora
      - midjourney
      - copilot
      - cursor
      - windows
      - iphone
      - ios
      - android
      - python
      - node
      - php
      - excel
      - word
      - office
      - v
      - версия
      - версии
      - версию
  fanout:
    # Ширина окна параллельных суб-агентов (01-parallel-i-emkost.md §1-2).
    # При 8-14 разделах окно 6 = 2-3 волны: оркестратор не держит в контексте
    # всё тело. Шире окно - быстрее, но дороже шов: дрейф голоса между секциями
    # чинится швом (§1.4) и финальным хуманайзером (§2.2), а они монолитны.
    section_workers: 6      # черновик: сколько разделов пишется одновременно (§1.2)
    humaniser_workers: 6    # хуманайзер: сколько секций чистится одновременно (§2.1)
  cache:
    # Кэш куста work/_cache/<cluster>/ (01-parallel-i-emkost.md §3): ресёрч,
    # снимки выдачи и корпус originality собираются ОДИН раз на кластер.
    # Инвалидация проверяется ДО чтения, по meta.json.
    # 🔴 НЕ кэшируется никогда: цены, тарифы, лимиты, номера версий, наличие
    # фич - закон 11 ZAKONY-SEO.md требует живой проверки на каждом касании.
    serp_ttl_days: 7        # снимок выдачи serp-<ключ>.md: выдача переставляется быстро
    research_ttl_days: 14   # фактура куста research.md + событийная сверка sha источников
  visual:
    # Гейты визуального слоя 2.0 (structure-check.py --visual). Канон правил -
    # knowledge/visual-layer.md, приёмка - checklists/visual.md.
    # 🔴 Гонять по СОБРАННОЙ странице index.html: в .md-черновике картинок нет.
    # ── происхождение кадра (закон владельца 22.08.2026, ZAKONY-SEO.md закон 22) ──
    # 🔴 ЭТОТ КЛЮЧ МАШИНА НЕ ЧИТАЕТ. Он ДОКУМЕНТНЫЙ маркер режима канона, а не
    # рабочий переключатель: читателя в коде нет ни одного (проверено грепом по
    # article_gates.py, structure-check.py, novice-check.py, own-evidence-check.py,
    # ftp_publish.py, shot.py, uniq.py, build_page.py, article_build.py = 0 совпадений).
    # Отличие от соседа: min_images ниже structure-check.py реально читает и рулит полом,
    # а frame_classes переставить в legacy = не изменить в поведении НИЧЕГО.
    # proof = пометка «канон по решению автора действует»: кадр обязан быть съёмкой реального
    #          прогона (класс из списка ниже, записан в $WORK/<slug>/shots-manifest.json),
    #          генеративный канал для SEO-статей закрыт.
    # legacy = пометка «страница из старого корпуса, снята до закона».
    # ФАКТИЧЕСКИЙ ОТКАТ = git revert канона + штатный мягкий режим гейта frame-provenance
    # (по умолчанию WARN, жёсткий - только под --provenance-hard в article_gates.py).
    frame_classes: proof     # ДОКУМЕНТНЫЙ маркер, читателя в коде нет
    # Легальные классы кадра (shots-manifest.json → "class"):
    #   result    - кейс-превью функции в реальном интерфейсе (вход → готовый выход)
    #   step      - путь клика, рамка-аннотация «жми сюда»
    #   own-run   - окно-чат Claude Code / веб-панель результата (НЕ оболочка/терминал)
    #   inherited - кадр перенесён с уже существующей страницы при её ревизии,
    #               съёмку инструмент не подтверждал, класс переходный
    min_images: 3            # ПОЛ оси: минимум ЕДИНИЦ на статью, независимо от длины.
                             # Единица = настоящая иллюстрация (<figure>) ИЛИ HTML-блок
                             # .vizblock (vizsteps/vizcheck/vizcompare). Так считает код:
                             # tools/structure-check.py, floor_units = figures + vizblocks.
                             # Таблицами и код-листингами НЕ закрывается - именно этот пол
                             # ловит голое полотно текста. Доказательного кадра нет
                             # (деградация закона 22) - ось закрывает .vizblock, добивать
                             # пол декорацией ради галочки запрещено
    # ── ПОЛ СОБСТВЕННЫХ КАДРОВ (по решению автора, дефект R128) ──────────────────────
    # Сосед min_images выше закрывается .vizblock-блоком наравне с картинкой, и это
    # оставляло дыру: страница с одним hero и восемью HTML-блоками формально проходила
    # визуальную ось, а глазами читалась как заготовка. Этот ключ считает ТОЛЬКО
    # <figure> собранной страницы и НЕ закрывается ни .vizblock, ни таблицей, ни
    # листингом. Замер живого корпуса 245 страниц по решению автора: медиана 3, p25 2, p75 5,
    # max 13; у эталона того же жанра 5-6 кадров на статью. Порог поставлен на медиану
    # СВОЕГО корпуса - он достижим без выдумывания кадров.
    # 🔴 ЭТОТ КЛЮЧ МАШИНА ЧИТАЕТ (в отличие от frame_classes выше): его берёт гейт
    # frame-density стадии page (article_gates.py, функция frame_count_min); ключа нет
    # в конфиге - гейт идёт на дефолте 3 и говорит об этом строкой отчёта.
    # Судится только НОВОЕ производство: пол включается там, где рядом со страницей
    # лежит shots-manifest.json; у старого корпуса манифеста нет, ему пол задним
    # числом не выставляется
    frame_count_min: 3       # минимум СОБСТВЕННЫХ кадров <figure> на новой странице
    words_per_image: 350     # плотность: не реже 1 визуального блока на столько слов
                             # ТЕЛА. Ключ прежний, поменялась БАЗА - см. density_basis
    # ── база счёта плотности (калибровка по корпусу по решению автора) ────────────────
    # Было: делитель применялся к ПОЛНОМУ объёму собранной страницы - проза плюс
    # таблицы, листинги, FAQ, чек-лист, «Источники», «Читайте также», CTA. Канон
    # (knowledge/visual-layer.md) при этом всегда говорил «на ~300 слов ТЕКСТА
    # ТЕЛА». Замер корпуса по решению автора по 44 опубликованным страницам: старая база
    # красила красным 21 из 44 (48%), новая - 5 из 44, и 4 из этих пяти вообще
    # без единой иллюстрации. Числа замера - строками выше (44 страницы, 21 из 44 против 5 из 44).
    density_basis: prose     # prose - считать от объёма ПРОЗЫ (по умолчанию):
                             #   из объёма вычитаются <table>, <pre>, <figure>,
                             #   служебные секции хвоста (FAQ / чек-лист /
                             #   источники / читайте также / CTA / share / автор)
                             #   и навигация (nav, оглавление, хлебные крошки).
                             # full - прежнее поведение байт-в-байт (аварийный выход)
    max_images_required: 10  # потолок ТРЕБУЕМОГО числа блоков. Линейный рост
                             # требования на длинной статье и есть та механика, из-за
                             # которой гейт упирался в «нужно 16»: добить такую цифру
                             # можно только текст-карточками, а они запрещены правилом
                             # владельца («текст картинкой ухудшает загрузку и
                             # не даёт пользы»). 0 = потолка нет
    count_visual_blocks: true  # плотность закрывается ВИЗУАЛЬНЫМИ БЛОКАМИ: иллюстрация
                             # + таблица + код-листинг. Таблица и листинг сами являются
                             # визуальными элементами, а норматив r7 требует минимум
                             # 3 таблицы на статью - без этого ключа два требования
                             # движка воевали бы друг с другом. false = считать только
                             # иллюстрации (прежнее поведение)
    h2_min: 12 # вилка контентных H2-разделов, СНЯТА С ЭТАЛОНА по решению автора
    h2_max: 20               # (круг 2, R71/R76). Замер 24 живых пар «наша против топ-3»:
                             # у топ-3 h2 всего медиана 9.5 · p90 16.1 · max 21, у нашего
                             # живого корпуса медиана 16 · p90 19. Лучшая страница эталона
                             # того же жанра (донор владельца движка, адрес держится в его
                             # НЕраздаваемом каноне) несёт 21 h2 = 19 КОНТЕНТНЫХ + 2
                             # служебных, и хвост у неё подынтентовый
                             # («если платёж не проходит», «как отменить», «частые ошибки»,
                             # «как платить меньше»). Прежняя вилка 8-14 стояла ниже и
                             # эталона, и нашего корпуса - то есть структурно запрещала
                             # собрать длинный хвост. Потолок 20 = 19 эталона + слот запаса,
                             # пол 12 = выше нынешних 9-10 нашего аналога по жанру
    min_internal_links: 3    # перелинковка в свой кластер
    alt_min: 50              # длина alt в знаках
    alt_max: 125
  length:
    # Целевая длина тела статьи по интенту (слов). Проверяется глазами на Этапе 2,
    # машинно страхуется вилкой H2 12-20 (снята с эталона по решению автора).
    tail_min: 900             # хвостовая единица: узкий задачный/сравнительный запрос, термин
    tail_max: 1200
    instruction_min: 2000    # инструкция «как сделать» (основной тип лид-магнита)
    instruction_max: 3500
    pillar_min: 4000         # опорная статья кластера - от этого объёма
    review_min: 1200         # разбор / новость / обзор
    review_max: 2000

# ── SEO-хвост: отдельный конфиг публикации ───────────────────────────────────
# Инструменты публикации (ftp_publish.py, seo_publish.py) читают НЕ этот файл, а JSON
# ~/.config/seo-publish.json (или путь в --config / env SEO_PUBLISH_CONFIG). Там живут
# машинные значения хостинга. Обязательные ключи, без которых скрипт остановится:
#   domain      - адрес сайта со схемой, без слеша в конце
#   ftp_host    - хост FTP
#   ftp_user    - пользователь FTP (пароль ТОЛЬКО в связке ключей, в файл не пишем)
#   ftp_root    - корень сайта на хостинге (в yaml-конфиге скилла это поле ftp_dir)
#   metrika_id  - номер счётчика аналитики: гейт проверяет, что счётчик стоит на странице
# Необязательные: page_prefix (дефолт guide-), author_name, author_url, indexnow_key
# (пусто = сгенерится сам), root_pages, redirected, skip_flat, landing_dirs, skip_schema.
# Готовый шаблон с подставленными значениями - в config.md, раздел «SEO-хвост».
seo_tail:
  config_path: "~/.config/seo-publish.json"
  required: [domain, ftp_host, ftp_user, ftp_root, metrika_id]
  optional: [page_prefix, author_name, author_url, indexnow_key, root_pages,
             redirected, skip_flat, landing_dirs, skip_schema]

image:
  # "local" = локальный картинко-конвейер (без генеративных моделей и кредитов),
  # путь к набору скриптов - из конфига проекта. Основной канал - СЪЁМКА реального
  # интерфейса (закон владельца 22.08.2026, ZAKONY-SEO.md закон 22). Пример вызова:
  #   python3 <путь-из-конфига>/shot.py --url "<адрес функции>" --out <slug>-hero.png \
  #       --class result --manifest $WORK/<slug>/shots-manifest.json   # hero одним переходом
  #   python3 <путь-из-конфига>/shot.py --scenario steps.json --out <каталог кадров> \
  #       --class step --manifest $WORK/<slug>/shots-manifest.json   # многошаговый путь клика
  # Класс ставится ПО КАДРУ: поле "class" в шаге steps.json скрипт читает первым, --class
  # работает дефолтом для шагов без этого поля. Имя кадра сценария - поле "name" шага.
  # Имена: hero и og - <slug>-hero / <slug>-og (реестр assets.jsonl, чек-лист 0d.3 и
  # шаблон черновика зовут их так же), кадры тела - <slug>-step-N / <slug>-result-N.
  # 🔴 Генеративные генераторы (og_hero.py / meme.py / cards.py / cover.py) для SEO-статей
  # ЗАКРЫТЫ законом 22 (в других скиллах живут - те файлы не трогаем).
  # Канон визуального слоя: knowledge/visual-layer.md, приёмка: checklists/visual.md.
  # Пустая строка "" = инструмента физически нет, Этап 6b выключен (единственная валидная причина).
  tool: "local"
  # путь к каталогу инструментов съёмки (shot.py и его помощники) - у каждого автора свой
  path: "<путь-к-своим-инструментам-съёмки>"
  format: "webp"
  # имя файла манифеста происхождения кадров. 🔴 Лежит в $WORK/<slug>/ РЯДОМ со страницей,
  # НЕ в assets/: заливка на прод тарит assets/ целиком, манифест уехал бы наружу
  manifest: "shots-manifest.json"
  og_size: "1200x630"   # og = тот же кадр hero или его плотный кроп на зону результата
  # 🔴 ЕДИНЫЙ канон путей: картинки статьи лежат в подкаталоге assets/ каталога статьи и
  # адресуются относительным `assets/<имя>.webp` (так работает живая страница, так же
  # кладёт файлы ftp_publish.py → /guide-<slug>/assets/…). Корневой /assets/ - только для
  # общих ассетов сайта (фото автора, favicon). Каталога /images/ на проде нет.
  dest: "./assets"
  ratio: "16:9"
  max_kb: 200
