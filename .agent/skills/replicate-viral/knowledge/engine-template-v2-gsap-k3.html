*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
html,body{width:1080px;height:1920px;overflow:hidden;background:#16110d}

.spkcard video{position:absolute;left:50%;transform:translateX(-50%);width:940px}
.spkcut{position:absolute;left:50%;transform:translateX(-50%);width:940px;pointer-events:none}
#cap{position:absolute;left:0;right:0;top:1250px;text-align:center}

.route{position:absolute;border-radius:20px;padding:26px 30px;font-family:Oswald,sans-serif;font-weight:700;

.caret{display:inline-block;width:14px;height:34px;background:#f3ece0;vertical-align:-4px;margin-left:3px}

const tl = gsap.timeline({paused:true});

function typeInto(el,text,t0,dur,caret){const n=text.length;
  for(let i=0;i<=n;i++) tl.call(((k)=>()=>{el.innerHTML=text.slice(0,k)+(caret?'<span class="caret"></span>':'');})(i),[],t0+i*(dur/n));}
function countUp(el,from,to,suf,t0,dur,steps){for(let i=0;i<=steps;i++){const v=Math.round(from+(to-from)*i/steps);
  tl.call(((val)=>()=>{el.textContent=val.toLocaleString('ru-RU')+suf;})(v),[],t0+dur*i/steps);}}

  seekVid($('spk1bg'),t); seekVid($('spk1cut'),t);
  seekVid($('spk2bg'),t-47.97); seekVid($('spk2cut'),t-47.97);

  let cur=(t>=10.4&&t<47.5)?CAPS.find(c=>t>=c.t0&&t<c.t1):null;

};
