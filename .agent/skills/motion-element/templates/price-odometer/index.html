<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0e0f13; font-family: Inter, system-ui, sans-serif; }
      #wrap { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; }
      #label { font-size: 44px; font-weight: 600; color: #9aa3b2; letter-spacing: 2px; text-transform: uppercase; opacity: 0; margin-bottom: 26px; }
      #old { position: relative; display: inline-block; font-size: 90px; font-weight: 800; color: #6b7280; opacity: 0; }
      #strikeline { position: absolute; left: -8px; right: -8px; top: 52%; height: 8px; background: #ff5a5a; border-radius: 4px; transform: scaleX(0); transform-origin: left; }
      #now { font-size: 210px; font-weight: 900; color: #fff; line-height: 1; margin-top: 14px; text-shadow: 0 0 60px rgba(54,201,142,.45); }
      #now .cur { color: #36c98e; }
      #badge { display: inline-block; margin-top: 30px; font-size: 46px; font-weight: 800; color: #0e0f13; background: #36c98e; padding: 14px 34px; border-radius: 18px; opacity: 0; }
      #wm { position: absolute; right: 80px; bottom: 130px; font-size: 30px; font-weight: 600; color: rgba(255,255,255,.62); z-index: 99; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1080" data-height="1920">
      <div id="wrap">
        <div id="label">Доступ в клуб</div>
        <div id="old">$197<div id="strikeline"></div></div>
        <div id="now" data-sfx="tick" data-sfx-at="roll"><span class="cur">$</span><span id="val">197</span></div>
        <div id="badge" data-sfx="clink" data-sfx-at="settle">−51%</div>
      </div>
      <div id="wm"><твой-хэндл></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const FROM = 197, TO = 97;
      const valEl = document.getElementById("val");

      tl.to("#label", { opacity: 1, duration: 0.4 }, 0.2);
      tl.to("#old", { opacity: 1, duration: 0.4 }, 0.5);
      tl.to("#strikeline", { scaleX: 1, duration: 0.5, ease: "power2.out" }, 0.8);

      // roll price down 197 → 97 (driven by timeline progress)
      tl.add("roll", 1.0);
      const o = { v: FROM };
      tl.to(o, { v: TO, duration: 1.8, ease: "power3.inOut",
        onUpdate: () => { valEl.textContent = Math.round(o.v); } }, "roll");

      tl.add("settle", "roll+=1.8");
      tl.fromTo("#now", { scale: 1 }, { scale: 1.12, duration: 0.2, ease: "back.out(3)", yoyo: true, repeat: 1 }, "settle");
      tl.to("#badge", { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, "settle+=0.1");
      tl.to("#wrap", { opacity: 1, duration: 1.6 }, 4.0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
