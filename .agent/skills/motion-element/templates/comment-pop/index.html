<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0e0f13; font-family: Inter, system-ui, sans-serif; }
      /* solid key bg for transparent output mode (chroma / remove-background) */
      #root { --accent: #4f8cff; background: #0e0f13; }
      .card {
        position: absolute; display: flex; gap: 22px; align-items: flex-start;
        width: 760px; padding: 26px 30px; border-radius: 28px;
        background: #1b1d24; box-shadow: 0 18px 50px rgba(0,0,0,.45);
        opacity: 0; will-change: transform, opacity;
      }
      .av { flex: 0 0 84px; width: 84px; height: 84px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-size: 40px; font-weight: 800; color: #fff; }
      .body { display: flex; flex-direction: column; gap: 6px; padding-top: 4px; }
      .name { font-size: 30px; font-weight: 700; color: #fff; }
      .text { font-size: 32px; line-height: 1.25; color: #d7dae2; }
      .like { margin-left: auto; align-self: center; font-size: 40px; opacity: .9; }
      .emoji { position: absolute; font-size: 70px; opacity: 0; will-change: transform, opacity; }
      #wm { position: absolute; right: 80px; bottom: 130px; font-size: 30px; font-weight: 600;
        color: rgba(255,255,255,.62); letter-spacing: .5px; z-index: 99; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1080" data-height="1920">
      <!-- comment cards: positions inside safe-zone (top/bottom 130, left/right 80). x/y seeded, no RNG -->
      <div class="card" id="c0" style="left:90px;  top:300px;"><div class="av" style="background:#4f8cff">А</div><div class="body"><div class="name">Артём</div><div class="text">как?? это реально за 20 минут?</div></div><div class="like">❤️</div></div>
      <div class="card" id="c1" style="left:230px; top:470px;"><div class="av" style="background:#ff5a8a">М</div><div class="body"><div class="name">Марина</div><div class="text">дай скилл пожалуйста 🙏</div></div><div class="like">🔥</div></div>
      <div class="card" id="c2" style="left:70px;  top:650px;"><div class="av" style="background:#36c98e">D</div><div class="body"><div class="name">Денис</div><div class="text">это меняет всё для меня</div></div><div class="like">❤️</div></div>
      <div class="card" id="c3" style="left:240px; top:820px;"><div class="av" style="background:#f0a43a">К</div><div class="body"><div class="name">Катя</div><div class="text">сижу в шоке честно</div></div><div class="like">😮</div></div>
      <div class="card" id="c4" style="left:90px;  top:990px;"><div class="av" style="background:#9b6cff">И</div><div class="body"><div class="name">Игорь</div><div class="text">сколько стоит научиться?</div></div><div class="like">🔥</div></div>
      <div class="card" id="c5" style="left:230px; top:1160px;"><div class="av" style="background:#4f8cff">О</div><div class="body"><div class="name">Оля</div><div class="text">первый раз вижу такое</div></div><div class="like">❤️</div></div>
      <div class="card" id="c6" style="left:70px;  top:1330px;"><div class="av" style="background:#ff5a8a">С</div><div class="body"><div class="name">Семён</div><div class="text">бери деньги, я в деле</div></div><div class="like">💸</div></div>
      <div class="card" id="c7" style="left:250px; top:1500px;"><div class="av" style="background:#36c98e">Л</div><div class="body"><div class="name">Лера</div><div class="text">это просто топ 🚀</div></div><div class="like">🔥</div></div>

      <!-- emoji burst (climax), pre-seeded positions around center -->
      <div class="emoji" id="e0" style="left:520px; top:980px;">❤️</div>
      <div class="emoji" id="e1" style="left:300px; top:880px;">🔥</div>
      <div class="emoji" id="e2" style="left:720px; top:900px;">💸</div>
      <div class="emoji" id="e3" style="left:420px; top:760px;">❤️</div>
      <div class="emoji" id="e4" style="left:640px; top:1080px;">🔥</div>
      <div class="emoji" id="e5" style="left:520px; top:1180px;">🚀</div>

      <div id="wm" data-sfx-skip><твой-хэндл></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Comments pop in: slow → fast (accelerating cascade). Each gets a label for SFX cue (data-sfx="pop").
      const ids = ["#c0","#c1","#c2","#c3","#c4","#c5","#c6","#c7"];
      // accelerating start times: gaps shrink 0.62 → 0.22
      const starts = [0.2, 0.85, 1.45, 2.0, 2.5, 2.95, 3.32, 3.62];
      ids.forEach((id, i) => {
        tl.add("c" + i, starts[i]);
        tl.fromTo(id, { opacity: 0, scale: 0.6, y: 40 },
          { opacity: 1, scale: 1, y: 0, duration: 0.42, ease: "back.out(2)" }, "c" + i);
      });

      // Climax: emoji burst outward + fade. Label "burst" → data-sfx="impact".
      tl.add("burst", 4.0);
      ["#e0","#e1","#e2","#e3","#e4","#e5"].forEach((id, i) => {
        const ang = (i / 6) * Math.PI * 2;          // deterministic, computed once at load
        const dx = Math.cos(ang) * 260, dy = Math.sin(ang) * 260 - 120;
        tl.fromTo(id, { opacity: 0, scale: 0.3, x: 0, y: 0 },
          { opacity: 1, scale: 1.2, x: dx, y: dy, duration: 0.9, ease: "power2.out" }, "burst");
        tl.to(id, { opacity: 0, duration: 0.6 }, "burst+=0.9");
      });

      // Hold so cards stay readable to the end (the "pause to read" beat).
      tl.to("#root", { opacity: 1, duration: 1.4 }, 6.0);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
