; Настройки набора проверок движка.
;
; Зачем этот файл. Папка движка РАЗДАЁТСЯ: ты её показываешь, кладёшь в репозиторий,
; отдаёшь помощнику. Значит после любой проверки в ней не должно оставаться рабочего
; мусора - ни после первого прогона, ни после сотого.
;
; -p no:cacheprovider выключает кэш прогона: каталог .pytest_cache не создаётся ВООБЩЕ.
; Правило стоит здесь, а не в установщике, специально: установщик - лишь один из способов
; запустить проверки. Ты запустишь их ещё и руками, и из редактора, и из другой папки, и
; тогда флаг в установщике не поможет, а этот файл поможет: pytest находит его сам по
; папке движка. Один запрет вместо флага в каждой команде.
;
; Прецедент по решению автора: проверки, запущенные на шаг выше папки движка, положили
; .pytest_cache рядом с движком, и скан личного объявил утечкой ссылку из файла README
; внутри этого кэша. То есть штатная установка ломала собственную проверку чистоты.
[pytest]
addopts = -p no:cacheprovider
testpaths = tests
