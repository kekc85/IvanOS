[pytest]
# Тесты кита написаны отдельными скриптами: каждый печатает свой итог и выходит кодом.
# Импортировать их pytest'ом нельзя - при импорте они сразу отрабатывают и зовут sys.exit,
# и сборщик тестов падает внутренней ошибкой. Поэтому собирается ОДИН файл-обёртка,
# который запускает каждый скрипт подпроцессом и требует нулевой код возврата.
python_files = test_kit_smoke.py
testpaths = tests
addopts = -q
